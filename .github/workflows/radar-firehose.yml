name: Radar Aggregator Firehose

on:
  schedule:
    # Shortly BEFORE a radar refresh (which runs at 15 */6), so the snapshot
    # this produces is an hour and a half old when that run folds it in. This
    # workflow used to run the full 547-employer refresh itself purely to merge
    # its own output — two complete refreshes a day for a file the next
    # scheduled run would have picked up anyway.
    - cron: "45 4,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize complete firehose runs without blocking unrelated radar writers
# during the long crawl. Only the short publish job takes radar-data-main.
concurrency:
  group: radar-firehose-run
  cancel-in-progress: false
  queue: max

jobs:
  firehose:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      has_output: ${{ steps.output.outputs.publish }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Mark the checked-out snapshot baseline
        run: touch "$RUNNER_TEMP/firehose-start"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install scout deps
        run: |
          python -m venv scout/.venv
          scout/.venv/bin/pip install -r scout/requirements.txt
          scout/.venv/bin/python -m playwright install --with-deps chromium
      - name: Scrape aggregators + apply cap-exempt filter
        id: scrape
        run: npm run scout:aggregators -- --all --details 150 --import
      - name: Verify current-run firehose output
        id: output
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          file=radar/data/aggregated-jobs.json
          if [ ! "$file" -nt "$RUNNER_TEMP/firehose-start" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.scrape.outcome }}" = "success" ]; then
              echo "::error::Firehose exited successfully without rewriting aggregated-jobs.json."
              exit 1
            fi
            echo "Firehose failed before producing a safe current-run store; nothing will be published."
            exit 0
          fi
          node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!Number.isFinite(Date.parse(value.updated_at||"")) || !Array.isArray(value.jobs) || !value.snapshots || typeof value.snapshots!=="object") throw new Error("invalid aggregated-jobs store");' "$file"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Save the firehose store
        id: artifact
        if: ${{ always() && !cancelled() && steps.output.outputs.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregated-jobs-${{ github.run_id }}
          path: radar/data/aggregated-jobs.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: firehose
    if: ${{ always() && !cancelled() && needs.firehose.outputs.has_output == 'true' && needs.firehose.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: radar-data-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Sync to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Restore the current-run firehose store
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.firehose.outputs.artifact_id }}
          path: ${{ runner.temp }}/firehose-artifact
      - name: Reject an older firehose store
        run: |
          node -e '
          const fs = require("fs");
          const incomingPath = process.argv[1];
          const currentPath = process.argv[2];
          const incoming = JSON.parse(fs.readFileSync(incomingPath, "utf8"));
          const incomingAt = Date.parse(incoming.updated_at || "");
          if (!Number.isFinite(incomingAt) || !Array.isArray(incoming.jobs) || !incoming.snapshots) {
            throw new Error("incoming firehose artifact is invalid");
          }
          if (fs.existsSync(currentPath)) {
            const current = JSON.parse(fs.readFileSync(currentPath, "utf8"));
            const currentAt = Date.parse(current.updated_at || "");
            if (Number.isFinite(currentAt) && incomingAt < currentAt) {
              throw new Error(`refusing firehose rollback: artifact ${incoming.updated_at} is older than main ${current.updated_at}`);
            }
          }
          fs.copyFileSync(incomingPath, currentPath);
          ' "$RUNNER_TEMP/firehose-artifact/aggregated-jobs.json" radar/data/aggregated-jobs.json
      - name: Commit firehose data
        # Only the aggregator store. This workflow does not own the refresh
        # report and must never overwrite it.
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Update aggregator firehose data"
          file_pattern: "radar/data/aggregated-jobs.json"

  notify:
    needs: [firehose, publish]
    if: ${{ always() && (needs.firehose.result != 'success' || (needs.firehose.outputs.has_output == 'true' && needs.publish.result != 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Alert on failure
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set; skipping alert"; exit 0; }
          curl -sS -H "Title: $WORKFLOW_NAME failed" \
            -H "Tags: rotating_light" \
            -d "Workflow '$WORKFLOW_NAME' failed on $REF_NAME. Run: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
