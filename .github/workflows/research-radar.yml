name: Research Job Radar

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The group covers every job that writes Supabase or commits radar data, so
    # their pushes serialize instead of racing to a non-fast-forward failure. It
    # is declared per JOB, not per workflow: GitHub keeps only one running and
    # one pending entry per group, so a five-hour crawl holding it at workflow
    # level displaces the 6-hourly refresh entirely.
    #
    # The serialization is also what makes the differential sync safe: it lets a
    # run treat the table it read at the start as the whole table.
    concurrency:
      group: radar-data-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh public ATS data
        run: npm run radar:refresh
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Judge new postings against the profile
        # Deliberately AFTER the refresh and deliberately WITHOUT if: always().
        # The sync is differential now — it writes what changed and deletes what
        # left, rather than rewriting the table — but a refresh whose sync fails
        # exits non-zero precisely so this step is skipped: the table would be
        # missing that run's writes, and judging it means paying to read
        # postings about to change or disappear. If the refresh itself failed,
        # there is nothing here worth reading either.
        run: node radar/scripts/judge-jobs.js --max-spend 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Sync to latest main (this run's outputs win)
        # if: always() -- a real bug found 2026-08-04: this workflow has no
        # timeout-minutes set (defaults to GitHub's 6h cap), and a run that
        # hits it gets cancelled with every step after "Refresh public ATS
        # data" skipped by default -- so a run that legitimately takes long
        # (registry growth, network slowness) silently commits nothing,
        # discarding real work rather than just leaving it unresumed.
        # Confirmed live: a same-day radar-firehose.yml run hit this exact
        # gap after 2h48m with zero commit.
        #
        # checkout pins github.sha from queue time, so commits that landed while
        # this run was pending/running would make a rebase conflict on
        # refresh-report.json. Runs in the radar-data group are serialized, so
        # this run's outputs are always the freshest — save, reset, restore.
        if: always()
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp radar/data/refresh-report.json "$tmp"/
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/* radar/data/
      - name: Commit refreshed radar data
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update research radar data"
          file_pattern: "radar/data/refresh-report.json"
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set; skipping alert"; exit 0; }
          curl -sS -H "Title: ${{ github.workflow }} failed" \
            -H "Tags: rotating_light" \
            -d "Workflow '${{ github.workflow }}' failed on ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
