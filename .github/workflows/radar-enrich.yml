name: Radar Enrichment

on:
  schedule:
    - cron: "25 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shares the radar-data group: enrichment commits different files, but a push
# race with the refresh workflows would still fail non-fast-forward.
concurrency:
  group: radar-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # DOL was the missing quarter of the picture. enrich.js reads LCA CSVs
      # out of radar/data/dol-raw and scout_dol.py has always known how to put
      # them there, but nothing ever invoked it — so dol_certified_3y was 0 for
      # all 20,378 directory entries and 0 for every registry employer, while
      # the dashboard's sponsorship-evidence column read from it as though it
      # meant something. USCIS says an employer sponsored SOMEBODY; the LCA
      # file carries job titles, which is what lets the join count sponsorship
      # for research roles specifically.
      - name: Fetch DOL LCA disclosure data
        id: dol
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m venv scout/.venv
          scout/.venv/bin/pip install -r scout/requirements.txt
          scout/.venv/bin/python -m playwright install --with-deps chromium
          scout/.venv/bin/python scout/scout_dol.py
      # continue-on-error above is deliberate: the DOL file sits behind Akamai
      # and is fetched through a real browser session, which is the least
      # reliable step in this workflow. A month where it 403s should cost the
      # DOL column, not the IPEDS/IRS/USCIS joins that make up the rest of the
      # directory. enrich.js already treats an empty dol-raw as "no DOL data".
      - name: Run monthly enrichment (IPEDS + IRS EO BMF + USCIS + DOL joins)
        run: npm run radar:enrich -- --force
      - name: Sync to latest main (this run's outputs win)
        # if: always() -- same real bug found 2026-08-04 in radar-firehose.yml
        # (confirmed live: a run cancelled after 2h48m committed nothing at
        # all, because every step after the cancelled one was skipped by
        # default). This job has no timeout-minutes set (GitHub's 6h default
        # applies) and downloads/joins large IPEDS/IRS/USCIS datasets, so a
        # slow month is just as exposed.
        #
        # checkout pins github.sha from queue time, so commits that landed while
        # this run was pending/running would make a rebase conflict on shared
        # report files. Runs in the radar-data group are serialized, so this
        # run's outputs are always the freshest — save, reset, restore.
        if: always()
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp radar/data/employer-enrichment.json radar/data/discovery-candidates.json radar/data/enrichment-report.json radar/data/cap-exempt-directory.json "$tmp"/
          git fetch origin main
          git reset --hard origin/main
          cp "$tmp"/* radar/data/
      - name: Commit enrichment outputs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update employer enrichment, discovery, and cap-exempt directory"
          file_pattern: "radar/data/employer-enrichment.json radar/data/discovery-candidates.json radar/data/enrichment-report.json radar/data/cap-exempt-directory.json"
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set; skipping alert"; exit 0; }
          curl -sS -H "Title: ${{ github.workflow }} failed" \
            -H "Tags: rotating_light" \
            -d "Workflow '${{ github.workflow }}' failed on ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
