name: Radar Employer Scout

# Scouts registry employers that have no clean ATS feed (Playwright page
# triage per radar/SCOUT-CONTRACT.md). Snapshots expire after 14 days, so a
# weekly run keeps the scouted employers continuously covered.
on:
  schedule:
    - cron: "35 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# The crawl and the commit are separate jobs on purpose. The crawl can run for
# five hours; the commit takes seconds. Holding the shared radar-data group for
# the whole crawl meant a Monday scout displaced the 6-hourly refresh entirely,
# because GitHub keeps only one running and one pending entry per group and
# cancels the older pending one. Only the publish job takes the group now.
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scout deps
        run: |
          python -m venv scout/.venv
          scout/.venv/bin/pip install -r scout/requirements.txt
          scout/.venv/bin/python -m playwright install --with-deps chromium
      - name: Scout employers without ATS feeds
        run: npm run scout:jobs -- --all --import
      - name: Save the snapshot
        # if: always() -- a run cancelled at the timeout (confirmed live in
        # radar-firehose.yml on 2026-08-04, 2h48m of work committed nowhere)
        # skips every later step by default. Whatever the crawl imported before
        # it was cut off is still worth keeping.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scouted-jobs
          path: radar/data/scouted-jobs.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: scout
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialized against every other job that commits radar data or writes
    # Supabase — held for the couple of minutes this takes, not for the crawl.
    concurrency:
      group: radar-data-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # checkout pins github.sha from queue time, so commits that landed while
      # the crawl was running would make a rebase conflict. Reset to main FIRST,
      # then lay this run's snapshot on top.
      - name: Sync to latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Restore the snapshot (this run's output wins)
        uses: actions/download-artifact@v4
        with:
          name: scouted-jobs
          path: radar/data/
        continue-on-error: true
      - name: Commit scouted data
        # No refresh here: the snapshot is TTL-gated for 14 days and the next
        # 6-hourly radar run folds it into Supabase within the hour. Running a
        # full 547-employer refresh to publish one file was most of what made
        # this workflow hold the group for so long.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update scouted employer data"
          file_pattern: "radar/data/scouted-jobs.json"
      - name: Alert on failure
        if: failure() || cancelled() || needs.scout.result != 'success'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set; skipping alert"; exit 0; }
          curl -sS -H "Title: ${{ github.workflow }} failed" \
            -H "Tags: rotating_light" \
            -d "Workflow '${{ github.workflow }}' failed on ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
