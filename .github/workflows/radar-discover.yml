name: Radar Employer Discovery

# Crawls candidate employer websites (radar/data/cap-exempt-directory.json)
# for ATS-platform signatures, feeding radar/data/ats-discovery.json — the
# raw material promote-employers.js turns into reviewed registry proposals.
# Distinct from the weekly Employer Scout workflow, which scrapes job
# postings for employers *already* in the registry with no ATS feed.
#
# SHARDED. The crawl is one page at a time and ~15s a site, so the 3,541
# institutions still uncrawled are ~15 hours of work — more than a GitHub job
# may run, which is why a single-job version of this never cleared its backlog
# and said so in its own comments. Each shard now takes 1/N of the queue on its
# own runner (~1.8h at the default 8), and a final job merges the results into
# one commit. Runners are free on public repos, so N is limited by politeness
# and the merge, not by budget.
#
# Triggered after the scheduled monthly enrichment completes successfully (that
# is what adds new candidate employers). This avoids a fixed-time race with a
# slow or queued enrichment run. Manual discovery remains an explicit action;
# manually re-running enrichment does not unexpectedly start a full crawl.
on:
  workflow_run:
    workflows: ["Radar Enrichment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel workers (each takes 1/N of the queue)"
        required: false
        default: "8"
        type: choice
        options: ["1", "4", "8", "12", "16"]
      limit:
        description: "Cap total sites crawled across all shards (blank = whole queue)"
        required: false
        default: ""

permissions:
  contents: read

# A later crawl must start after the prior crawl publishes its census update.
# Other radar writers remain free until this workflow reaches its merge job.
concurrency:
  group: radar-discovery-run
  cancel-in-progress: false
  queue: max

# The radar-data group is taken by the MERGE job only (see below). The plan job
# and the 330-minute shard matrix touch nothing shared, and holding the group
# across them displaced the 6-hourly refresh for the length of the crawl.
jobs:
  upstream_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report failed scheduled enrichment
        run: |
          echo "::error::Scheduled enrichment did not succeed, so discovery cannot use a current candidate directory."
          exit 1

  # A matrix cannot be a plain expression, so the shard list is computed here
  # and consumed via fromJSON. This is what lets the shard count be a dispatch
  # input instead of a number baked into the file.
  plan:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          COUNT: ${{ inputs.shards || '8' }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          n = int(os.environ['COUNT'])
          print('shards=' + json.dumps(list(range(n))))
          print('count=' + str(n))
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    # Each shard is ~1/N of ~15h. Stay under the 6h hard cap with room for a
    # shard that draws an unlucky run of slow sites.
    timeout-minutes: 330
    strategy:
      # One shard hitting a pathological site must not cancel the other seven —
      # whatever they crawled is real progress and the merge takes what exists.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install scout deps
        run: |
          python -m venv scout/.venv
          scout/.venv/bin/pip install -r scout/requirements.txt
          scout/.venv/bin/python -m playwright install --with-deps chromium
      - name: Crawl shard ${{ matrix.shard }}
        # Unbuffered, or a stuck shard is undiagnosable. Python buffers stdout
        # when it isn't a terminal, so shard 0 of the first full sweep ran for
        # two hours and left ZERO log lines — never enough output to fill one
        # buffer before it was killed. The logs are the only way to tell a dead
        # runner from slow websites after the fact.
        env:
          PYTHONUNBUFFERED: "1"
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          mkdir -p shards
          out="shards/shard-${{ matrix.shard }}.json"
          shard="${{ matrix.shard }}/${{ needs.plan.outputs.count }}"
          # The path is absent from checkout. Seed a valid, current-run empty
          # result so a successful no-work shard still has an artifact, while a
          # setup failure before this step cannot upload a stale repository file.
          scout/.venv/bin/python -c 'import datetime,json,sys; print(json.dumps({"schema_version":1,"generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"shard":sys.argv[1],"employers":{}}))' "$shard" > "$out"
          args=(--all --shard "$shard" --out "$out")
          if [[ -n "$LIMIT" && ! "$LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::limit must be a positive integer"
            exit 2
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          scout/.venv/bin/python scout/scout_discover.py "${args[@]}"
      # Preserve checkpoints from failed shards, but an explicit workflow
      # cancellation must not create artifacts that a publisher could consume.
      - name: Upload shard results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovery-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  merge:
    needs: [plan, crawl]
    # Runs even when some shards failed or timed out — a partial crawl is
    # progress, and discarding it would mean the backlog never shrinks.
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # This is the only job here that commits, so it is the only one that needs
    # to serialize against the other radar workflows.
    concurrency:
      group: radar-data-main
      cancel-in-progress: false
      queue: max
    steps:
      # This job starts only after it acquires the shared writer lock. Checkout
      # current main here, then merge shards into it; never round-trip a census
      # copied from the workflow's older queue-time SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download every shard that produced results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: discovery-shard-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Verify shard artifact coverage
        id: shard_health
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(shards/shard-*.json)
          expected="${{ needs.plan.outputs.count }}"
          received="${#files[@]}"
          complete=false
          if [ -n "$expected" ] && [ "$received" -eq "$expected" ]; then
            complete=true
          fi
          node - "$expected" "${files[@]}" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expected = Number(process.argv[2]);
          const files = process.argv.slice(3);
          if (!Number.isInteger(expected) || expected < 1) throw new Error('invalid expected shard count');
          const seen = new Set();
          for (const file of files) {
            const match = /^shard-(\d+)\.json$/.exec(path.basename(file));
            if (!match) throw new Error(`${file}: invalid shard filename`);
            const index = Number(match[1]);
            if (!Number.isInteger(index) || index < 0 || index >= expected || seen.has(index)) {
              throw new Error(`${file}: invalid or duplicate shard index`);
            }
            seen.add(index);
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (value.schema_version !== 1) throw new Error(`${file}: invalid schema_version`);
            if (value.shard !== `${index}/${expected}`) throw new Error(`${file}: wrong shard identity ${value.shard}`);
            const generatedAt = Date.parse(value.generated_at || '');
            if (!Number.isFinite(generatedAt) || generatedAt > Date.now() + 5 * 60 * 1000
                || Date.now() - generatedAt > 8 * 24 * 60 * 60 * 1000) {
              throw new Error(`${file}: generated_at is outside the artifact window`);
            }
            if (!value.employers || typeof value.employers !== 'object' || Array.isArray(value.employers)) {
              throw new Error(`${file}: invalid employers object`);
            }
          }
          NODE
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          {
            echo "## Discovery shard health"
            echo
            echo "- Matrix result: ${{ needs.crawl.result }}"
            echo "- Expected artifacts: ${expected:-unknown}"
            echo "- Received artifacts: $received"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$received" -eq 0 ]; then
            echo "::error::No discovery shard artifacts were produced."
            exit 1
          fi
      - name: Merge shards into the census
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(shards/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shard artifacts — nothing to merge."
            exit 0
          fi
          node radar/scripts/merge-discovery.js "${files[@]}"
      - name: Commit discovery data
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Update ATS discovery crawl data"
          file_pattern: "radar/data/ats-discovery.json"
      - name: Mark partial discovery as degraded
        if: ${{ always() && (needs.crawl.result != 'success' || steps.shard_health.outputs.complete != 'true') }}
        run: |
          echo "::error::Discovery published only validated partial progress; one or more shards failed or were missing."
          exit 1
      - name: Alert on failure
        if: ${{ failure() || cancelled() || needs.crawl.result != 'success' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set; skipping alert"; exit 0; }
          curl -sS -H "Title: $WORKFLOW_NAME failed" \
            -H "Tags: rotating_light" \
            -d "Workflow '$WORKFLOW_NAME' failed on $REF_NAME. Run: $RUN_URL" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
